AWSTemplateFormatVersion: "2010-09-09"
Description: >
  itov - ComfyUI + Wan 2.2 14B image-to-video on a private GPU.
  No inbound ports (SSM-only access), encrypted disk and bucket.

Parameters:
  InstanceType:
    Type: String
    Default: g6e.xlarge
    AllowedValues: [g6e.xlarge, g6e.2xlarge, g6e.4xlarge, g6.2xlarge, g6.4xlarge, g5.2xlarge, g5.4xlarge]
    Description: g6e = L40S 48GB, g6 = L4 24GB, g5 = A10G 24GB.
  VolumeSizeGB:
    Type: Number
    Default: 200
  AvailabilityZone:
    Type: String
    Default: ""
    Description: Optional. Empty = AZ chosen by AWS.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-24.04/latest/ami-id
    Description: AWS Deep Learning Base AMI (NVIDIA drivers preinstalled).

Conditions:
  HasAz: !Not [!Equals [!Ref AvailabilityZone, ""]]

Resources:
  # ---------- Private storage for input/output ----------
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # ---------- Instance permissions: SSM + its own bucket only ----------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: itov-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt DataBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${DataBucket.Arn}/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # No inbound rules: no SSH, no open ports.
  NoIngressSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: itov - no inbound, SSM-only access

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        InstanceInitiatedShutdownBehavior: stop

  # ---------- GPU ----------
  GpuInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      AvailabilityZone: !If [HasAz, !Ref AvailabilityZone, !Ref "AWS::NoValue"]
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt NoIngressSG.GroupId]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSizeGB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: itov-comfyui }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # First boot: installs ComfyUI + Wan 2.2 14B. Log: /var/log/itov-setup.log
          exec > /var/log/itov-setup.log 2>&1
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          mkdir -p /opt/itov
          touch /opt/itov/SETUP_IN_PROGRESS

          apt-get update
          apt-get install -y git python3-venv python3-pip ffmpeg aria2

          # swap: helps when the two 14B models alternate in RAM
          [ -f /swapfile ] || { fallocate -l 32G /swapfile; chmod 600 /swapfile; mkswap /swapfile; swapon /swapfile; echo "/swapfile none swap sw 0 0" >> /etc/fstab; }

          id comfy || useradd -m -s /bin/bash comfy

          # --- ComfyUI ---
          git clone https://github.com/comfyanonymous/ComfyUI.git /opt/comfyui
          python3 -m venv /opt/comfyui/venv
          /opt/comfyui/venv/bin/pip install --upgrade pip
          /opt/comfyui/venv/bin/pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128
          /opt/comfyui/venv/bin/pip install -r /opt/comfyui/requirements.txt

          # --- Wan 2.2 I2V 14B models (fp8, ~35GB) ---
          cat > /opt/itov/download-models.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail
          M=/opt/comfyui/models
          W22=https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files
          W21=https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged/resolve/main/split_files
          get() { mkdir -p "$M/$1"; [ -s "$M/$1/$(basename "$2")" ] || aria2c -x8 -s8 -c -d "$M/$1" -o "$(basename "$2")" "$2"; }
          get diffusion_models $W22/diffusion_models/wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
          get diffusion_models $W22/diffusion_models/wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
          get loras            $W22/loras/wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors
          get loras            $W22/loras/wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors
          get text_encoders    $W21/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
          get vae              $W21/vae/wan_2.1_vae.safetensors
          EOF
          chmod +x /opt/itov/download-models.sh
          /opt/itov/download-models.sh

          chown -R comfy:comfy /opt/comfyui

          # Disable the "API" nodes (paid external services) if the version supports it
          EXTRA=""
          if /opt/comfyui/venv/bin/python /opt/comfyui/main.py --help 2>/dev/null | grep -q -- --disable-api-nodes; then EXTRA="--disable-api-nodes"; fi

          # Listens ONLY on localhost: reachable exclusively through the SSM tunnel
          cat > /etc/systemd/system/comfyui.service <<EOF
          [Unit]
          Description=ComfyUI
          After=network-online.target
          [Service]
          User=comfy
          WorkingDirectory=/opt/comfyui
          ExecStart=/opt/comfyui/venv/bin/python main.py --listen 127.0.0.1 --port 8188 $EXTRA
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          EOF

          # --- S3 sync (input <- bucket, output -> bucket) ---
          cat > /opt/itov/s3-sync.sh <<'EOF'
          #!/bin/bash
          # usage: s3-sync.sh <bucket> pull|push|wipe
          set -euo pipefail
          B=$1; C=/opt/comfyui
          case $2 in
            pull) aws s3 sync "s3://$B/input/" "$C/input/" ;;
            push) aws s3 sync "$C/output/" "s3://$B/output/" --sse AES256 ;;
            wipe) find "$C/input" "$C/output" -mindepth 1 ! -name '_*' -delete ;;
          esac
          chown -R comfy:comfy "$C/input" "$C/output"
          EOF
          chmod +x /opt/itov/s3-sync.sh

          # --- Auto-shutdown after 30 min of inactivity ---
          # active = GPU in use OR a ComfyUI tab open (tunnel connected)
          cat > /opt/itov/idle-check.sh <<'EOF'
          #!/bin/bash
          IDLE_MIN=30
          F=/opt/itov/last_active
          [ -e /opt/itov/SETUP_IN_PROGRESS ] && { date +%s > $F; exit 0; }
          GPU=$(nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits | head -1)
          CONN=$(ss -Htn state established '( sport = :8188 )' | wc -l)
          if [ "${GPU:-0}" -gt 10 ] || [ "$CONN" -gt 0 ] || [ ! -e $F ]; then date +%s > $F; exit 0; fi
          if [ $(( $(date +%s) - $(cat $F) )) -gt $(( IDLE_MIN * 60 )) ]; then
            logger "itov: idle for ${IDLE_MIN} min, shutting down"; rm -f $F; shutdown -h now
          fi
          EOF
          chmod +x /opt/itov/idle-check.sh
          cat > /etc/systemd/system/itov-idle.service <<'EOF'
          [Service]
          Type=oneshot
          ExecStart=/opt/itov/idle-check.sh
          EOF
          cat > /etc/systemd/system/itov-idle.timer <<'EOF'
          [Timer]
          OnBootSec=5min
          OnUnitActiveSec=2min
          [Install]
          WantedBy=timers.target
          EOF
          # the counter restarts from zero at boot
          echo 'd /opt/itov 0755 root root -' > /etc/tmpfiles.d/itov.conf
          echo 'r /opt/itov/last_active' >> /etc/tmpfiles.d/itov.conf

          systemctl daemon-reload
          systemctl enable --now comfyui.service itov-idle.timer
          rm -f /opt/itov/SETUP_IN_PROGRESS
          touch /opt/itov/SETUP_DONE
          echo "ITOV SETUP DONE"

Outputs:
  InstanceId:
    Value: !Ref GpuInstance
  BucketName:
    Value: !Ref DataBucket
