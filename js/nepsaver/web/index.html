<!doctype html>
<html>
<head><meta charset="utf-8"><title>nepsaver</title></head>
<body>
  <h1>nepsaver</h1>
  <p>Adds the latest unplayed episode of each podcast you follow to a playlist.</p>
  <form action="/submit" method="post">
    <label for="playlist">Playlist ID (leave empty to use PLAYLIST_ID from .env): </label>
    <input id="playlist" type="text" name="playlist_id" value="" />
    <input type="submit" value="Login with Spotify" />
  </form>
</body>
</html>
